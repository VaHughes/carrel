# The five gates CONTRIBUTING names, in its order, and one step more.
#
# The extra step is `cargo check --workspace --all-targets`. The benches are
# not RUN here — that is the packaging cycle's business, and a timing number
# from a shared runner would be noise anyway — but nothing else compiles them,
# and a bench that stopped compiling should not reach main.
#
# Clippy is spelled with `-D warnings`, which is the machine form of
# CONTRIBUTING's "ZERO warnings is the bar": the same bar, enforced instead of
# read. A local run without it prints the warnings and exits 0.
#
# The project has required "CI must run check-discipline.sh" since the first
# commit; this is that requirement made real.
#
# The toolchain is PINNED, not `stable`: clippy runs with -D warnings, and a
# moving stable grows new lints that would break CI on days nobody changed
# anything. Bump the pin deliberately, together with the local toolchain.
#
# Release-artifact builds belong to the packaging cycle, not here.
#
# Note that `push: branches: [main]` does NOT match a tag push. release.yml
# therefore carries its own `gate` job running these same five, and that job is
# the only thing standing between a tag and six published archives — keep the
# two toolchain pins equal.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to commit SHAs: tags and branches are
      # mutable refs, and a compromised action repo can rewrite them. The
      # comment records the human-readable version each SHA corresponds to.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain (pinned)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Tests
        run: cargo test --workspace

      - name: Clippy (zero warnings is the bar)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all --check

      - name: Benches still compile
        run: cargo check --workspace --all-targets

      - name: Architectural discipline
        run: ./scripts/check-discipline.sh

      # Nothing else builds the packaging recipes, so a recipe that installs a
      # file the release archive does not contain fails for the first time on
      # a USER's machine. That happened: carrel-bin named five files `include`
      # never shipped. This is the static half of the check; the release
      # runbook runs the same script against the real artifact before
      # publishing a binary package.
      - name: Packaging recipes match what ships
        run: ./scripts/check-packaging.sh

  # The MSRV is a claim in three files (Cargo.toml, the README, the Fedora
  # spec) and until now was built by nothing — it said 1.90, which `merman`'s
  # own 1.95 floor made impossible, so a `cargo install` on 1.90 failed for a
  # user rather than here. `--locked` because the point is the committed
  # resolve, not whatever cargo would pick today.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain (the declared MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: It builds on the version we tell people to have
        run: cargo check --workspace --all-targets --locked
