# dist (cargo-dist) release configuration — packaging spec §1.
# Six unix targets; Windows joins after the Q19 minimum-viable port.
# NOTE: `dist init` rewrites this file and DELETES its comments — re-add them
# after any regeneration (it happened once already, 2026-08-17).
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. The homebrew formula is BUILT here
# (it rides the release as `carrel.rb`) but is NOT pushed to the tap by CI: the
# publish job would need a HOMEBREW_TAP_TOKEN repo secret with write access to
# the tap, and without it the job fails and blocks `announce`. Until that secret
# exists, the formula is committed to `VaHughes/homebrew-tap` by hand from the
# release artifact — see RELEASING.md step 10. Re-add "homebrew" to publish-jobs
# (and regenerate release.yml) the moment the secret is set.
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "VaHughes/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Extra files bundled into every archive — the desktop entry rides along so
# distro packagers and manual installers get it without cloning the repo (Q21),
# and so do the man page and completions, because `carrel-bin` on the AUR
# installs them FROM THE ARCHIVE and cannot reach into the repo. Leaving them
# out made that package unbuildable and the release notes wrong (2026-08-16).
# NOTE: dist FLATTENS these to the archive root — `contrib/carrel.1` arrives as
# `carrel.1`. Packaging recipes must use the flat names.
include = ["contrib/carrel.desktop", "contrib/carrel.1", "contrib/completions/carrel.bash", "contrib/completions/carrel.zsh", "contrib/completions/carrel.fish"]
